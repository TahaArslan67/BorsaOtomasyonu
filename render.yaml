services:
  - type: web
    name: gmstr-prediction-system
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn gmstr_prediction_system:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
    plan: free
    autoDeploy: true
