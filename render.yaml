services:
  - type: web
    name: gmstr-prediction-system
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn gmstr_prediction_system:app --timeout 120 --workers 1 --threads 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: FLASK_DEBUG
        value: false
      - key: RENDER_EXTERNAL_URL
        value: https://borsaotomasyonu.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: gmstr-db
          property: connectionString
    plan: free
    autoDeploy: true

databases:
  - name: gmstr-db
    plan: free
    ipAllowList: []
