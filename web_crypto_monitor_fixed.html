<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Monitor - Web Uygulaması</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #1e1e1e;
            color: white;
            padding: 10px;
        }
        
        .header {
            text-align: center;
            padding: 20px;
            background: #2d2d2d;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        .sound-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .sound-btn.off {
            background: #f44336;
        }
        
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .card {
            background: #2d2d2d;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            border: 2px solid #444;
        }
        
        .card h3 {
            font-size: 16px;
            margin-bottom: 10px;
        }
        
        .card.gmstr h3 { color: #00ff00; }
        .card.btc h3 { color: #ff9500; }
        .card.eth h3 { color: #627eea; }
        
        .price {
            font-size: 18px;
            font-weight: bold;
            margin: 10px 0;
        }
        
        .signal {
            font-size: 14px;
            margin: 10px 0;
            padding: 5px;
            border-radius: 5px;
        }
        
        .signal.up {
            background: #00ff00;
            color: black;
        }
        
        .signal.down {
            background: #ff0000;
            color: white;
        }
        
        .target {
            font-size: 12px;
            color: #ccc;
        }
        
        .update-time {
            text-align: center;
            color: #888;
            font-size: 12px;
        }
        
        .loading {
            color: #888;
        }
        
        @media (max-width: 480px) {
            .cards-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .header h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>GMSTR | BTC | ETH CANLI MONİTÖR</h1>
        <button class="sound-btn" id="soundBtn" onclick="toggleSound()">🔊 SES AÇIK</button>
    </div>
    
    <div class="cards-grid">
        <div class="card gmstr">
            <h3>GMSTR<br>4 SAAT</h3>
            <div class="price" id="gmstr-4h-price">Yükleniyor...</div>
            <div class="signal" id="gmstr-4h-signal">--</div>
            <div class="target" id="gmstr-4h-target">--</div>
        </div>
        
        <div class="card gmstr">
            <h3>GMSTR<br>1 GÜN</h3>
            <div class="price" id="gmstr-1d-price">Yükleniyor...</div>
            <div class="signal" id="gmstr-1d-signal">--</div>
            <div class="target" id="gmstr-1d-target">--</div>
        </div>
        
        <div class="card btc">
            <h3>BTC<br>4 SAAT</h3>
            <div class="price" id="btc-4h-price">Yükleniyor...</div>
            <div class="signal" id="btc-4h-signal">--</div>
            <div class="target" id="btc-4h-target">--</div>
        </div>
        
        <div class="card btc">
            <h3>BTC<br>1 GÜN</h3>
            <div class="price" id="btc-1d-price">Yükleniyor...</div>
            <div class="signal" id="btc-1d-signal">--</div>
            <div class="target" id="btc-1d-target">--</div>
        </div>
        
        <div class="card eth">
            <h3>ETH<br>4 SAAT</h3>
            <div class="price" id="eth-4h-price">Yükleniyor...</div>
            <div class="signal" id="eth-4h-signal">--</div>
            <div class="target" id="eth-4h-target">--</div>
        </div>
        
        <div class="card eth">
            <h3>ETH<br>1 GÜN</h3>
            <div class="price" id="eth-1d-price">Yükleniyor...</div>
            <div class="signal" id="eth-1d-signal">--</div>
            <div class="target" id="eth-1d-target">--</div>
        </div>
    </div>
    
    <div class="update-time" id="updateTime">Son Güncelleme: --</div>
    
    <script>
        let soundEnabled = true;
        let lastBtcSignal = null;
        let lastEthSignal = null;
        
        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('soundBtn');
            if (soundEnabled) {
                btn.textContent = '🔊 SES AÇIK';
                btn.classList.remove('off');
            } else {
                btn.textContent = '🔇 SES KAPALI';
                btn.classList.add('off');
            }
        }
        
        function playSound() {
            if (soundEnabled) {
                // Titreşim veya ses
                if ('vibrate' in navigator) {
                    navigator.vibrate(500);
                } else {
                    // Ses çal (basit bip)
                    const audio = new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBTGH0fPTgjMGHm7A7+OZURE');
                    audio.play();
                }
            }
        }
        
        // Gelişmiş teknik analiz fonksiyonları
        function calculateSMA(data, period) {
            let sum = 0;
            for (let i = data.length - period; i < data.length; i++) {
                sum += data[i];
            }
            return sum / period;
        }
        
        function calculateEMA(data, period) {
            const multiplier = 2 / (period + 1);
            let ema = data[0];
            for (let i = 1; i < data.length; i++) {
                ema = (data[i] * multiplier) + (ema * (1 - multiplier));
            }
            return ema;
        }
        
        function calculateRSI(data, period = 14) {
            if (data.length < period + 1) return 50;
            
            let gains = 0;
            let losses = 0;
            
            for (let i = 1; i <= period; i++) {
                const diff = data[i] - data[i - 1];
                if (diff > 0) gains += diff;
                else losses -= diff;
            }
            
            const avgGain = gains / period;
            const avgLoss = losses / period;
            const rs = avgGain / avgLoss;
            return 100 - (100 / (1 + rs));
        }
        
        function calculateMACD(data) {
            const ema12 = calculateEMA(data, 12);
            const ema26 = calculateEMA(data, 26);
            return ema12 - ema26;
        }
        
        function calculateBollingerBands(data, period = 20) {
            const sma = calculateSMA(data, period);
            let squaredDiffs = 0;
            for (let i = data.length - period; i < data.length; i++) {
                squaredDiffs += Math.pow(data[i] - sma, 2);
            }
            const stdDev = Math.sqrt(squaredDiffs / period);
            return {
                upper: sma + (2 * stdDev),
                middle: sma,
                lower: sma - (2 * stdDev)
            };
        }
        
        function calculateStochastic(data, highData, lowData, period = 14) {
            let highestHigh = Math.max(...highData.slice(-period));
            let lowestLow = Math.min(...lowData.slice(-period));
            const currentClose = data[data.length - 1];
            return ((currentClose - lowestLow) / (highestHigh - lowestLow)) * 100;
        }
        
        function calculateATR(data, highData, lowData, period = 14) {
            let trSum = 0;
            for (let i = 1; i <= period; i++) {
                const high = highData[i];
                const low = lowData[i];
                const prevClose = data[i - 1];
                const tr = Math.max(high - low, Math.abs(high - prevClose), Math.abs(low - prevClose));
                trSum += tr;
            }
            return trSum / period;
        }
        
        function calculateVolumeDelta(volumeData, period = 20) {
            if (volumeData.length < period + 1) return 0;
            const currentVolume = volumeData[volumeData.length - 1];
            const avgVolume = volumeData.slice(-period - 1, -1).reduce((a, b) => a + b, 0) / period;
            return ((currentVolume - avgVolume) / avgVolume) * 100;
        }
        
        function calculateZScore(data, period = 20) {
            if (data.length < period) return 0;
            const recentData = data.slice(-period);
            const mean = recentData.reduce((a, b) => a + b, 0) / period;
            const variance = recentData.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / period;
            const stdDev = Math.sqrt(variance);
            const currentPrice = data[data.length - 1];
            return (currentPrice - mean) / stdDev;
        }
        
        function calculateMomentum(data, period = 10) {
            if (data.length < period + 1) return 0;
            return data[data.length - 1] - data[data.length - 1 - period];
        }
        
        function calculateWilliamsR(data, highData, lowData, period = 14) {
            let highestHigh = Math.max(...highData.slice(-period));
            let lowestLow = Math.min(...lowData.slice(-period));
            const currentClose = data[data.length - 1];
            return -100 * ((highestHigh - currentClose) / (highestHigh - lowestLow));
        }
        
        function calculateOBV(data, volumeData) {
            let obv = 0;
            for (let i = 1; i < data.length; i++) {
                if (data[i] > data[i - 1]) {
                    obv += volumeData[i];
                } else if (data[i] < data[i - 1]) {
                    obv -= volumeData[i];
                }
            }
            return obv;
        }
        
        function calculateCCI(data, highData, lowData, period = 20) {
            const typicalPrices = [];
            for (let i = 0; i < data.length; i++) {
                typicalPrices.push((highData[i] + lowData[i] + data[i]) / 3);
            }
            
            const recentTP = typicalPrices.slice(-period);
            const smaTP = recentTP.reduce((a, b) => a + b, 0) / period;
            const mad = recentTP.reduce((a, b) => a + Math.abs(b - smaTP), 0) / period;
            const currentTP = typicalPrices[typicalPrices.length - 1];
            
            return (currentTP - smaTP) / (0.015 * mad);
        }
        
        // Gelişmiş tahmin algoritması
        function getAdvancedPrediction(candles) {
            if (!candles || candles.length < 50) {
                return null;
            }
            
            // Verileri çıkar
            const closes = candles.map(c => parseFloat(c[4]));
            const highs = candles.map(c => parseFloat(c[2]));
            const lows = candles.map(c => parseFloat(c[3]));
            const volumes = candles.map(c => parseFloat(c[5]));
            
            // Teknik göstergeleri hesapla
            const rsi = calculateRSI(closes);
            const macd = calculateMACD(closes);
            const bb = calculateBollingerBands(closes);
            const stochastic = calculateStochastic(closes, highs, lows);
            const atr = calculateATR(closes, highs, lows);
            const volumeDelta = calculateVolumeDelta(volumes);
            const zScore = calculateZScore(closes);
            const momentum = calculateMomentum(closes);
            const williamsR = calculateWilliamsR(closes, highs, lows);
            const obv = calculateOBV(closes, volumes);
            const cci = calculateCCI(closes, highs, lows);
            
            const currentPrice = closes[closes.length - 1];
            
            // Gelişmiş sinyal mantığı
            let signal = 0;
            let confidence = 0;
            
            // RSI sinyali
            if (rsi < 30) {
                signal += 2;
                confidence += 0.3;
            } else if (rsi > 70) {
                signal -= 2;
                confidence += 0.3;
            }
            
            // MACD sinyali
            if (macd > 0) {
                signal += 1;
                confidence += 0.2;
            } else {
                signal -= 1;
                confidence += 0.2;
            }
            
            // Bollinger Bands sinyali
            if (currentPrice < bb.lower) {
                signal += 2;
                confidence += 0.25;
            } else if (currentPrice > bb.upper) {
                signal -= 2;
                confidence += 0.25;
            }
            
            // Stochastic sinyali
            if (stochastic < 20) {
                signal += 1;
                confidence += 0.15;
            } else if (stochastic > 80) {
                signal -= 1;
                confidence += 0.15;
            }
            
            // Momentum sinyali
            if (momentum > 0) {
                signal += 1;
                confidence += 0.1;
            } else {
                signal -= 1;
                confidence += 0.1;
            }
            
            // Williams %R sinyali
            if (williamsR < -80) {
                signal += 1;
                confidence += 0.1;
            } else if (williamsR > -20) {
                signal -= 1;
                confidence += 0.1;
            }
            
            // CCI sinyali
            if (cci < -100) {
                signal += 1;
                confidence += 0.1;
            } else if (cci > 100) {
                signal -= 1;
                confidence += 0.1;
            }
            
            // Hacim onayı
            if (volumeDelta > 20) {
                confidence += 0.2;
            }
            
            // Son sinyal
            const finalSignal = signal > 0 ? 1 : 0;
            
            // Hedef fiyat hesaplama
            let targetMultiplier = 1.01; // Default %1
            if (confidence > 0.7) {
                targetMultiplier = finalSignal === 1 ? 1.03 : 0.97; // %3
            } else if (confidence > 0.5) {
                targetMultiplier = finalSignal === 1 ? 1.02 : 0.98; // %2
            }
            
            const targetPrice = currentPrice * targetMultiplier;
            
            return {
                currentPrice,
                signal: finalSignal,
                target: targetPrice,
                confidence,
                indicators: {
                    rsi,
                    macd,
                    stochastic,
                    momentum,
                    volumeDelta
                }
            };
        }
        
        async function fetchBinanceData(symbol) {
            try {
                const response = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=1h&limit=100`);
                const data = await response.json();
                return getAdvancedPrediction(data);
            } catch (error) {
                console.error(`Error fetching ${symbol}:`, error);
                return null;
            }
        }
        
        function getGMSTRData() {
            // GMSTR için daha gerçekçi örnek veri
            const basePrice = 1000 + Math.sin(Date.now() / 100000) * 100 + Math.random() * 50;
            const candles = [];
            
            for (let i = 0; i < 100; i++) {
                const price = basePrice + (Math.random() - 0.5) * 100;
                const high = price * (1 + Math.random() * 0.02);
                const low = price * (1 - Math.random() * 0.02);
                const volume = 100000 + Math.random() * 900000;
                
                candles.push([
                    Date.now() - (100 - i) * 3600000, // timestamp
                    price.toFixed(2), // open
                    high.toFixed(2), // high
                    low.toFixed(2), // low
                    price.toFixed(2), // close
                    volume.toFixed(0) // volume
                ]);
            }
            
            return getAdvancedPrediction(candles);
        }
        
        function updateCard(prefix, data, isGMSTR = false) {
            const priceEl = document.getElementById(`${prefix}-price`);
            const signalEl = document.getElementById(`${prefix}-signal`);
            const targetEl = document.getElementById(`${prefix}-target`);
            
            if (!data) {
                priceEl.textContent = 'Veri yüklenemedi';
                signalEl.textContent = '--';
                signalEl.className = 'signal';
                targetEl.textContent = '--';
                return null;
            }
            
            const currency = isGMSTR ? '₺' : '$';
            priceEl.textContent = `${currency}${data.currentPrice.toFixed(2)}`;
            
            if (data.signal === 1) {
                signalEl.textContent = '📈 YÜKSELİŞ';
                signalEl.className = 'signal up';
            } else {
                signalEl.textContent = '📉 DÜŞÜŞ';
                signalEl.className = 'signal down';
            }
            
            targetEl.textContent = `Hedef: ${currency}${data.target.toFixed(2)}`;
            
            return data.signal;
        }
        
        async function updateData() {
            try {
                console.log('Veri güncelleniyor...');
                
                // GMSTR
                const gmstrData = getGMSTRData();
                updateCard('gmstr-4h', gmstrData, true);
                updateCard('gmstr-1d', gmstrData, true);
                
                // BTC
                const btcData = await fetchBinanceData('BTCUSDT');
                const btcSignal = updateCard('btc-4h', btcData);
                updateCard('btc-1d', btcData);
                
                // ETH
                const ethData = await fetchBinanceData('ETHUSDT');
                const ethSignal = updateCard('eth-4h', ethData);
                updateCard('eth-1d', ethData);
                
                // Sinyal değişimi kontrolü
                if (lastBtcSignal !== null && lastBtcSignal === 0 && btcSignal === 1) {
                    playSound();
                    console.log('BTC sinyal değişimi: Düşüş → Yükseliş');
                }
                if (lastEthSignal !== null && lastEthSignal === 0 && ethSignal === 1) {
                    playSound();
                    console.log('ETH sinyal değişimi: Düşüş → Yükseliş');
                }
                
                lastBtcSignal = btcSignal;
                lastEthSignal = ethSignal;
                
                // Güncelleme zamanı
                document.getElementById('updateTime').textContent = 
                    `Son Güncelleme: ${new Date().toLocaleTimeString()}`;
                    
                console.log('Veri güncellendi');
                    
            } catch (error) {
                console.error('Update error:', error);
            }
        }
        
        // İlk güncelleme
        updateData();
        
        // Her 5 dakikada bir güncelle
        setInterval(updateData, 5 * 60 * 1000);
        
        // Her 30 saniyede bir güncelle (daha sık)
        setInterval(updateData, 30 * 1000);
    </script>
</body>
</html>
