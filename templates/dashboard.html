<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GMSTR Tahmin Sistemi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        
        .header h1 {
            color: #2c3e50;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #7f8c8d;
            font-size: 1.2em;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: transform 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-card h3 {
            color: #34495e;
            font-size: 1.1em;
            margin-bottom: 10px;
        }
        
        .stat-card .value {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .stat-card.success .value {
            color: #27ae60;
        }
        
        .stat-card.warning .value {
            color: #f39c12;
        }
        
        .stat-card.danger .value {
            color: #e74c3c;
        }
        
        .predictions-section {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        
        .section-header h2 {
            color: #2c3e50;
            font-size: 1.8em;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .predictions-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        .predictions-table th,
        .predictions-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ecf0f1;
        }
        
        .predictions-table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #2c3e50;
        }
        
        .predictions-table tr:hover {
            background: #f8f9fa;
        }
        
        .direction-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
        }
        
        .direction-badge.up {
            background: #d4edda;
            color: #155724;
        }
        
        .direction-badge.down {
            background: #f8d7da;
            color: #721c24;
        }
        
        .accuracy-badge {
            padding: 4px 8px;
            border-radius: 15px;
            font-size: 0.8em;
            font-weight: 600;
        }
        
        .accuracy-badge.correct {
            background: #d4edda;
            color: #155724;
        }
        
        .accuracy-badge.incorrect {
            background: #f8d7da;
            color: #721c24;
        }
        
        .accuracy-badge.pending {
            background: #fff3cd;
            color: #856404;
        }
        
        .confidence-bar {
            width: 100%;
            height: 8px;
            background: #ecf0f1;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 5px;
        }
        
        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #e74c3c, #f39c12, #27ae60);
            transition: width 0.3s ease;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .model-status {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        
        .status-indicator.active {
            background: #27ae60;
            animation: pulse 2s infinite;
        }
        
        .status-indicator.inactive {
            background: #e74c3c;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .predictions-table {
                font-size: 0.9em;
            }
            
            .predictions-table th,
            .predictions-table td {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>GMSTR Tahmin Sistemi</h1>
            <p>%65+ Başarı Oranı ile Otomatik Tahmin Motoru</p>
        </div>
        
        <div class="model-status">
            <span class="status-indicator" id="modelStatus"></span>
            <span id="modelStatusText">Model Durumu Kontrol Ediliyor...</span>
        </div>
        
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card success">
                <h3>Toplam Tahmin</h3>
                <div class="value" id="totalPredictions">-</div>
                <div>Son 7 gün</div>
            </div>
            
            <div class="stat-card warning">
                <h3>Doğru Tahmin</h3>
                <div class="value" id="correctPredictions">-</div>
                <div>Son 7 gün</div>
            </div>
            
            <div class="stat-card danger">
                <h3>Başarı Oranı</h3>
                <div class="value" id="accuracyRate">-%</div>
                <div>Son 7 gün</div>
            </div>
        </div>
        
        <div class="predictions-section">
            <div class="section-header">
                <h2>Tahmin Geçmişi</h2>
                <div>
                    <button class="btn" onclick="makePrediction()">Yeni Tahmin Yap</button>
                    <button class="btn" onclick="trainModel()">Modeli Eğit</button>
                </div>
            </div>
            
            <div id="predictionsContainer">
                <div class="loading">
                    <div class="spinner"></div>
                    <div>Tahminler yükleniyor...</div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let predictions = [];
        
        // Sayfa yüklendiğinde verileri getir
        document.addEventListener('DOMContentLoaded', function() {
            loadPerformance();
            loadPredictions();
            checkModelStatus();
            
            // Her 5 dakikada bir verileri güncelle
            setInterval(() => {
                loadPerformance();
                loadPredictions();
            }, 5 * 60 * 1000);
        });
        
        async function loadPerformance() {
            try {
                const response = await fetch('/api/performance');
                const data = await response.json();
                
                if (data) {
                    document.getElementById('totalPredictions').textContent = data.total_predictions || 0;
                    document.getElementById('correctPredictions').textContent = data.correct_predictions || 0;
                    document.getElementById('accuracyRate').textContent = data.accuracy ? data.accuracy.toFixed(1) + '%' : '-%';
                    
                    // Renkleri güncelle
                    const accuracyCard = document.querySelector('.stat-card.danger');
                    if (data.accuracy >= 65) {
                        accuracyCard.classList.remove('danger');
                        accuracyCard.classList.add('success');
                    } else if (data.accuracy >= 50) {
                        accuracyCard.classList.remove('danger');
                        accuracyCard.classList.add('warning');
                    }
                }
            } catch (error) {
                console.error('Performans verileri yüklenemedi:', error);
            }
        }
        
        async function loadPredictions() {
            try {
                const response = await fetch('/api/predictions');
                predictions = await response.json();
                
                renderPredictions();
            } catch (error) {
                console.error('Tahminler yüklenemedi:', error);
                document.getElementById('predictionsContainer').innerHTML = '<div class="loading">Tahminler yüklenemedi</div>';
            }
        }
        
        function renderPredictions() {
            const container = document.getElementById('predictionsContainer');
            
            if (predictions.length === 0) {
                container.innerHTML = '<div class="loading">Henüz tahmin yapılmamış</div>';
                return;
            }
            
            let html = `
                <table class="predictions-table">
                    <thead>
                        <tr>
                            <th>Tahmin Zamanı</th>
                            <th>Geçerli Zaman</th>
                            <th>Mevcut Fiyat</th>
                            <th>Tahmin</th>
                            <th>Hedef Fiyat</th>
                            <th>Güven</th>
                            <th>Durum</th>
                            <th>📱</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            predictions.forEach(pred => {
                const predTime = new Date(pred.timestamp).toLocaleString('tr-TR');
                const validTime = pred.predicted_for_time ? new Date(pred.predicted_for_time).toLocaleString('tr-TR') : '-';
                const directionClass = pred.predicted_direction === 'YÜKSELİŞ' ? 'up' : 'down';
                
                let accuracyClass = 'pending';
                let accuracyText = 'Beklemede';
                
                if (pred.is_correct !== null) {
                    accuracyClass = pred.is_correct ? 'correct' : 'incorrect';
                    accuracyText = pred.is_correct ? 'Doğru' : 'Yanlış';
                }
                
                const telegramIcon = pred.telegram_sent ? '✅' : '-';
                
                html += `
                    <tr>
                        <td>${predTime}</td>
                        <td>${validTime}</td>
                        <td>₺${pred.current_price.toFixed(2)}</td>
                        <td>
                            <span class="direction-badge ${directionClass}">
                                ${pred.predicted_direction}
                            </span>
                        </td>
                        <td>₺${pred.predicted_price.toFixed(2)}</td>
                        <td>
                            ${(pred.confidence * 100).toFixed(1)}%
                            <div class="confidence-bar">
                                <div class="confidence-fill" style="width: ${pred.confidence * 100}%"></div>
                            </div>
                        </td>
                        <td>
                            <span class="accuracy-badge ${accuracyClass}">
                                ${accuracyText}
                            </span>
                        </td>
                        <td>${telegramIcon}</td>
                    </tr>
                `;
            });
            
            html += '</tbody></table>';
            container.innerHTML = html;
        }
        
        async function makePrediction() {
            const button = event.target;
            button.disabled = true;
            button.textContent = 'Tahmin Yapılıyor...';
            
            try {
                const response = await fetch('/api/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ timeframe: '4h' })
                });
                
                const result = await response.json();
                
                if (result.error) {
                    alert('Tahmin yapılamadı: ' + result.error);
                } else {
                    alert(`Tahmin yapıldı: ${result.direction} - Hedef: ₺${result.target_price.toFixed(2)}`);
                    loadPredictions();
                }
            } catch (error) {
                console.error('Tahmin hatası:', error);
                alert('Tahmin yapılamadı');
            } finally {
                button.disabled = false;
                button.textContent = 'Yeni Tahmin Yap';
            }
        }
        
        async function trainModel() {
            const button = event.target;
            button.disabled = true;
            button.textContent = 'Model Eğitiliyor...';
            
            try {
                const response = await fetch('/api/train', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const result = await response.json();
                
                if (result.error) {
                    alert('Model eğitilemedi: ' + result.error);
                } else {
                    alert('Model başarıyla eğitildi!');
                    checkModelStatus();
                }
            } catch (error) {
                console.error('Model eğitme hatası:', error);
                alert('Model eğitilemedi');
            } finally {
                button.disabled = false;
                button.textContent = 'Modeli Eğit';
            }
        }
        
        async function checkModelStatus() {
            try {
                const response = await fetch('/api/predictions');
                const data = await response.json();
                
                const statusIndicator = document.getElementById('modelStatus');
                const statusText = document.getElementById('modelStatusText');
                
                if (data && data.length > 0) {
                    statusIndicator.classList.add('active');
                    statusIndicator.classList.remove('inactive');
                    statusText.textContent = 'Model Aktif - Tahminler Yapılıyor';
                } else {
                    statusIndicator.classList.remove('active');
                    statusIndicator.classList.add('inactive');
                    statusText.textContent = 'Model Pasif - İlk Tahmini Yapın';
                }
            } catch (error) {
                const statusIndicator = document.getElementById('modelStatus');
                const statusText = document.getElementById('modelStatusText');
                
                statusIndicator.classList.remove('active');
                statusIndicator.classList.add('inactive');
                statusText.textContent = 'Model Bağlantı Hatası';
            }
        }
    </script>
</body>
</html>
