name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          git zip unzip openjdk-17-jdk \
          python3-pip autoconf libtool pkg-config \
          zlib1g-dev libncurses-dev libtinfo6 \
          cmake libffi-dev libssl-dev automake \
          libltdl-dev
        pip install --upgrade pip setuptools wheel
        pip install buildozer cython

    - name: Cache buildozer global
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: ${{ runner.os }}-buildozer-global-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-global-

    - name: Cache .buildozer dir
      uses: actions/cache@v4
      with:
        path: .buildozer
        key: ${{ runner.os }}-buildozer-local-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-local-

    - name: Build APK
      run: |
        echo "=== Starting Build ==="
        buildozer android debug
      timeout-minutes: 90
      env:
        BUILDOZER_WARN_ON_ROOT: 0
        ANDROIDSDK: /usr/local/lib/android/sdk
        ANDROIDNDK: /usr/local/lib/android/sdk/ndk/27.3.13750724

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: BorsaBot-APK
        path: bin/*.apk
        if-no-files-found: warn

    - name: List bin directory
      if: always()
      run: ls -la bin/ 2>/dev/null || echo "bin directory not found"
